<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИнфоДон · Диспетчерская посёлка</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f6f7ef; color: #193a33; font: 1rem/1.55 system-ui,sans-serif; }
  main { max-width: 58rem; margin: auto; padding: clamp(1rem,4vw,3rem); }
  img { display: block; width: 100%; height: auto; }
  h1 { margin-bottom: .3rem; font-size: clamp(1.6rem,4vw,2.2rem); }
  p { max-width: 65ch; }
  a { color: #135e4a; text-underline-offset: .15em; }
  details { background: white; padding: 1rem; border: 1px solid #c7d4c9; border-radius: .75rem; }
  summary { cursor: pointer; font-weight: 650; }
  pre { padding: .75rem; overflow: auto; background: #f4f7f1; font-size: .85rem; }
</style>
</head>
<body><main>
  <img src="assets/cover.svg" alt="ИнфоДон. Практика 01: Диспетчерская посёлка" width="1040" height="248">
  <h1>С чего начать</h1>
  <p>Кто звонил вчера и успел ли диспетчер передать обращение электрику? Продумайте, как следующая смена найдёт ответ. Сценарии и условия сдачи — в <a href="README.md">README.md</a>.</p>
  <h2>Учебные записи</h2>
  <p id="summary">Загрузка data.js…</p>
  <details><summary>Открыть данные для прототипа</summary><pre id="sample"></pre></details>
</main>
<script src="data.js"></script>
<script>
  const data = window.villageData
  document.querySelector('#summary').textContent = data
    ? 'Жителей: ' + data.residents.length + '. Обращений: ' + data.tickets.length + '. Звонков: ' + data.calls.length + '.'
    : 'Не удалось загрузить data.js. Проверьте, что файл находится рядом с index.html.'
  if (data) document.querySelector('#sample').textContent = JSON.stringify(data, null, 2)
</script>
</body>
</html>
