<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Диспетчерская посёлка</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <p class="eyebrow">ИнфоДон · практика 01</p>
    <h1>Диспетчерская посёлка</h1>
    <p class="hint">Один диспетчер, один экран. Звонки имитируются кнопками, жители и линии вымышлены.</p>
  </div>
  <div class="top-actions">
    <span class="pill">Данные: localStorage</span>
    <button type="button" class="btn ghost" data-action="reset">Сбросить демо</button>
  </div>
</header>
<div id="notice" class="notice-slot" aria-live="polite"></div>
<main class="grid">
  <section id="incoming" class="panel"></section>
  <section id="caller" class="panel"></section>
  <section id="ticket" class="panel"></section>
  <section id="missed" class="panel"></section>
  <section id="journal" class="panel"></section>
</main>
<footer class="foot">
  <p>Звонки имитируются кнопками. Линии не являются телефонными номерами. Данные сохраняются в браузере и переживают перезагрузку страницы.</p>
</footer>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
